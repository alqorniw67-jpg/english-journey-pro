<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f2347"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><title>English Journey Pro</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--navy:#0f2347;--blue:#2f6bff;--ink:#16213a;--mut:#69728a;--line:#e6e4dc;--ok:#1f9d6b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
h1,h2,h3,.en,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:600}
main{max-width:680px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 20px 20px;animation:in .3s}
@keyframes in{from{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mut{color:var(--mut)}small{font-size:13px}
h1{font-size:30px;line-height:1.15;margin:4px 0 18px;color:var(--navy)}h2{font-size:26px;line-height:1.2}h3{font-size:19px;margin:28px 0 10px;color:var(--navy)}
.ph{display:flex;justify-content:space-between;align-items:baseline}.ph span{font:400 13px system-ui;color:var(--mut)}
.hero{background:var(--navy);color:#fff;border-radius:24px;padding:22px;display:flex;gap:18px;align-items:center;margin:16px 0 18px}.hero .mut{color:#9db4e8}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:18px;background:var(--card);margin-bottom:16px}.stats div{padding:14px 8px;text-align:center}.stats div+div{border-left:1px solid var(--line)}.stats b{display:block;font:600 21px Georgia,serif;color:var(--navy)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;transition:transform .15s}.btn:active{transform:scale(.97)}.btn.s{background:#eaf0ff;color:var(--blue)}.btn.w{width:100%}.hero .btn{background:#fff;color:var(--navy);margin-top:10px}
.bar{height:6px;background:#e9ecf4;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width .5s}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.day{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer}.day .n{font:600 18px Georgia,serif;color:var(--blue);width:26px}.day .g{flex:1}.day.ok{background:#f0f8f4}.day.cur{border-color:var(--blue)}
.lnk{background:none;border:0;color:var(--blue);font:inherit;font-weight:600;cursor:pointer;margin-bottom:8px;padding:6px 0}
.note{background:#eef3ff;border-radius:12px;padding:11px 14px;font-size:14px;color:#33466f;margin:10px 0}
.pc{border-left:3px solid var(--blue);padding:4px 0 4px 14px;margin-bottom:16px}.en{font-size:19px;color:var(--navy)}.pc .chip{margin-top:6px;padding:4px 12px}
.act{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}.act .g{flex:1}.act.done{background:#f0f8f4}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid #c9cfdd;background:#fff;color:#fff;font-weight:700;cursor:pointer}.done .chk{background:var(--ok);border-color:var(--ok)}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:#fff;margin-bottom:10px;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.row>*{flex:0 0 auto}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;font:inherit;cursor:pointer}.opt.ok{border-color:var(--ok);background:#f0f8f4}.opt.bad{border-color:#d64545;background:#fdf0f0}
.card3{text-align:center;padding:34px 18px;min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.ln{padding:10px 14px;border-radius:14px;margin-bottom:8px;background:#fff;border:1px solid var(--line)}.ln.me{border-color:var(--blue);background:#f2f6ff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:10px}.cal b,.cal i{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font:inherit;font-size:14px;font-style:normal;font-weight:400}.cal b.on{background:var(--navy);color:#fff}.cal b.td{outline:2px solid var(--blue)}.cal u{font-size:12px;color:var(--mut);text-decoration:none}
.ach{display:flex;gap:12px;padding:8px 0;opacity:.45}.ach.on{opacity:1}.ach i{width:26px;height:26px;border-radius:50%;background:#dde3f0;display:grid;place-items:center;font-style:normal;color:#fff;flex:none}.ach.on i{background:var(--blue)}
.nt{margin-bottom:10px}.tag{font-size:12px;background:#eaf0ff;color:var(--blue);padding:2px 9px;border-radius:99px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 6px max(8px,env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;font:inherit;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}nav button.on{color:var(--blue);font-weight:600}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9}#toast.show{opacity:1;transform:translate(-50%,0)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
</style></head><body><div id="app"></div><div id="toast" role="status"></div><input type="file" id="imp" accept=".json,application/json" hidden>
<script>
const K='ejp.v2',ACT=['Membaca materi','Latihan soal','Mengulang materi','Speaking','Mengulang kosakata'],BOOK=['Otodidak Jago Kuasai Bahasa Inggris dari Nol','English Booster','English Killer'],PH=['Fondasi','Percakapan','Simulasi'];
const RAW=["Salam dan perkenalan|Hello, my name is Rina.;Halo, nama saya Rina.;ha-LOW, mai neim iz RI-na|Nice to meet you.;Senang bertemu denganmu.;nais tu mit yu",
"Kabar dan sopan santun|How are you today?;Apa kabar hari ini?;hau ar yu tu-DEI|I'm fine, thank you.;Saya baik, terima kasih.;aim fain, thenk yu",
"Kata ganti dan to be|I am a student.;Saya seorang pelajar.;ai em e STYU-dent|She is my friend.;Dia temanku.;syi iz mai frend",
"Angka dan umur|I am twenty years old.;Umur saya dua puluh tahun.;ai em TWEN-ti yirs old|I have three books.;Saya punya tiga buku.;ai hev thri buks",
"Keluarga|This is my mother.;Ini ibu saya.;this iz mai MA-ther|I have two brothers.;Saya punya dua saudara laki-laki.;ai hev tu BRA-therz",
"Benda di sekitar|What is this?;Ini apa?;wat iz this|It is a table.;Itu sebuah meja.;it iz e TEI-bel",
"Hari dan waktu|What time is it?;Jam berapa sekarang?;wat taim iz it|It is seven o'clock.;Sekarang jam tujuh.;it iz SE-ven e-KLOK",
"Rutinitas harian|I wake up at six.;Saya bangun jam enam.;ai weik ap at siks|I go to work by bus.;Saya berangkat kerja naik bus.;ai gou tu werk bai bas",
"Makanan dan minuman|I would like a cup of tea.;Saya mau secangkir teh.;ai wud laik e kap ov ti|Do you like coffee?;Apakah kamu suka kopi?;du yu laik KO-fi",
"Ulasan fondasi|Can you help me, please?;Bisakah kamu membantu saya?;ken yu help mi pliz|Sorry, I don't understand.;Maaf, saya tidak mengerti.;SO-ri, ai dount an-der-STEND",
"Bertanya arah|Where is the station?;Di mana stasiunnya?;wer iz the STEI-syen|Turn left at the corner.;Belok kiri di pojok.;tern left at the KOR-ner",
"Berbelanja|How much is this?;Berapa harga ini?;hau mach iz this|It's too expensive.;Ini terlalu mahal.;its tu ik-SPEN-siv",
"Di restoran|Can I see the menu?;Boleh saya lihat menunya?;ken ai si the ME-nyu|The bill, please.;Tolong tagihannya.;the bil, pliz",
"Transportasi|Does this bus go to the airport?;Apakah bus ini ke bandara?;daz this bas gou tu the ER-port|I'll take a taxi.;Saya akan naik taksi.;ail teik e TAK-si",
"Telepon|May I speak to Andi?;Boleh saya bicara dengan Andi?;mei ai spik tu AN-di|Please hold on.;Mohon tunggu sebentar.;pliz hold on",
"Kegiatan lampau|I went to the market yesterday.;Kemarin saya pergi ke pasar.;ai went tu the MAR-ket YES-ter-dei|We watched a movie.;Kami menonton film.;wi wacht e MU-vi",
"Rencana|I'm going to study tonight.;Malam ini saya akan belajar.;aim GO-ing tu STA-di tu-NAIT|What are you going to do?;Kamu akan melakukan apa?;wat ar yu GO-ing tu du",
"Hobi|What do you do in your free time?;Apa yang kamu lakukan di waktu luang?;wat du yu du in yor fri taim|I like reading books.;Saya suka membaca buku.;ai laik RI-ding buks",
"Cuaca|How's the weather today?;Bagaimana cuaca hari ini?;hauz the WE-ther tu-DEI|It's raining.;Sedang hujan.;its REI-ning",
"Ulasan percakapan|Could you say that again?;Bisa ulangi itu lagi?;kud yu sei that e-GEN|Could you speak slowly?;Bisa bicara lebih pelan?;kud yu spik SLOU-li",
"Kesehatan|I have a headache.;Saya sakit kepala.;ai hev e HED-eik|You should see a doctor.;Sebaiknya kamu ke dokter.;yu syud si e DOK-ter",
"Di hotel|I have a reservation.;Saya punya reservasi.;ai hev e re-zer-VEI-syen|What time is check-out?;Jam berapa check-out?;wat taim iz CHEK-aut",
"Di bandara|Where is gate five?;Di mana gerbang lima?;wer iz geit faiv|My flight is delayed.;Penerbanganku tertunda.;mai flait iz di-LEID",
"Bertemu orang baru|Where are you from?;Kamu berasal dari mana?;wer ar yu from|I'm from Indonesia.;Saya dari Indonesia.;aim from in-do-NI-zya",
"Pekerjaan|What do you do for a living?;Apa pekerjaanmu?;wat du yu du for e LI-ving|I work in an office.;Saya bekerja di kantor.;ai werk in an O-fis",
"Menyatakan pendapat|What do you think about it?;Menurutmu bagaimana?;wat du yu think e-BAUT it|I agree with you.;Saya setuju denganmu.;ai e-GRI with yu",
"Meminta dan menawarkan|Would you like some water?;Mau minum air?;wud yu laik sam WO-ter|Could you pass the salt?;Bisa tolong ambilkan garam?;kud yu pas the solt",
"Menyampaikan keluhan|I'd like to change this, please.;Saya ingin menukar ini.;aid laik tu cheinj this pliz|There is a problem.;Ada masalah.;ther iz e PRO-blem",
"Simulasi: memperkenalkan diri|Let me introduce myself.;Izinkan saya memperkenalkan diri.;let mi in-tro-DYUS mai-SELF|I'm learning English every day.;Saya belajar bahasa Inggris setiap hari.;aim LER-ning ING-glish EV-ri dei",
"Simulasi akhir|I've learned a lot in 30 days.;Saya belajar banyak dalam 30 hari.;aiv lernd e lot in THER-ti deiz|See you next time!;Sampai jumpa lagi!;si yu nekst taim"];
const DAYS=RAW.map(s=>{const a=s.split('|');return{t:a[0],p:a.slice(1).map(x=>x.split(';'))}}),ALLP=DAYS.flatMap(d=>d.p);
const DL=[{t:'Berkenalan',l:[['A','Hello! What is your name?','Halo! Siapa namamu?'],['B','My name is Dewi. Nice to meet you.','Namaku Dewi. Senang bertemu denganmu.'],['A','Nice to meet you too. Where are you from?','Senang bertemu juga. Kamu dari mana?'],['B','I am from Bandung. How about you?','Saya dari Bandung. Kalau kamu?']]},
{t:'Di restoran',l:[['A','Good evening. Can I take your order?','Selamat malam. Boleh saya catat pesananmu?'],['B','Yes, I would like fried rice and tea, please.','Ya, saya mau nasi goreng dan teh.'],['A','Anything else?','Ada lagi?'],['B','No, that is all. Thank you.','Tidak, itu saja. Terima kasih.']]},
{t:'Bertanya arah',l:[['A','Excuse me, where is the station?','Permisi, di mana stasiunnya?'],['B','Go straight, then turn left.','Lurus saja, lalu belok kiri.'],['A','Is it far from here?','Apakah jauh dari sini?'],['B','No, it is about five minutes on foot.','Tidak, sekitar lima menit jalan kaki.']]}];
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0'),dk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),tk=()=>dk(new Date());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const def=()=>({done:{},time:{},spent:{},att:{},notes:[],known:{},quiz:[],goal:30,dur:[10,10,10,10,10],run:null});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=def()}
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2300)};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Penyimpanan browser tidak tersedia')}};
const fm=s=>{s=Math.floor(s);return p2(Math.floor(s/60))+':'+p2(s%60)},hm=s=>{const m=Math.floor(s/60);return m>=60?Math.floor(m/60)+'j '+m%60+'m':m+' mnt'};
const live=()=>S.run?Math.min((Date.now()-S.run.t0)/1000,10800):0,todayS=()=>(S.time[tk()]||0)+live(),totalS=()=>Object.values(S.time).reduce((a,b)=>a+b,0)+live();
const isDone=i=>ACT.every((_,j)=>S.done[i]&&S.done[i][j]),doneN=()=>DAYS.filter((_,i)=>isDone(i)).length,act=()=>{const i=DAYS.findIndex((_,i)=>!isDone(i));return i<0?29:i};
const studied=d=>S.att[d]||(S.time[d]||0)>=60,streak=()=>{const d=new Date();if(!studied(dk(d)))d.setDate(d.getDate()-1);let n=0;while(studied(dk(d))){n++;d.setDate(d.getDate()-1)}return n};
const stop=()=>{if(!S.run)return;const e=live(),k=S.run.k,d=tk();S.spent[k]=(S.spent[k]||0)+e;S.time[d]=(S.time[d]||0)+e;S.run=null;save()};
const pool=()=>DAYS.slice(0,Math.max(act()+1,3)).flatMap(d=>d.p);
const deck=()=>pool().map(x=>({en:x[0],id:x[1],pr:x[2]})).concat(S.notes.filter(n=>n.type==='vocab').map(n=>({en:n.title,id:n.body,pr:''})));
let V='home',SEL=null,PT='cards',Q=null,C={i:0,s:0},TK={d:0,r:'A'},NE=null,NQ='',NF='all',CM=0;
const ic={home:'M3 11l9-8 9 8v10H3z',plan:'M4 6h16M4 12h16M4 18h10',prac:'M5 4h14v16H5zM9 9h6M9 13h4',notes:'M6 3h9l4 4v14H6zM9 12h7M9 16h5',me:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 4-6 8-6s8 2 8 6'};
const render=()=>{$('#app').innerHTML='<main>'+VW[V]()+'</main><nav>'+[['home','Beranda'],['plan','Belajar'],['prac','Latihan'],['notes','Catatan'],['me','Profil']].map(([k,l])=>`<button data-a="v" data-v="${k}" class="${V===k?'on':''}"><svg viewBox="0 0 24 24"><path d="${ic[k]}"/></svg>${l}</button>`).join('')+'</nav>'};
const go=()=>{render();scrollTo(0,0)};
const actRow=(i,j)=>{const k=i+'-'+j,on=S.done[i]&&S.done[i][j],r=S.run&&S.run.k===k,sp=(S.spent[k]||0)+(r?live():0);return `<div class="act ${on?'done':''}"><button class="chk" data-a="tgl" data-i="${i}" data-j="${j}" aria-label="Tandai ${ACT[j]}">${on?'✓':''}</button><div class="g"><b>${ACT[j]}</b><br><small class="mut"><span data-tk="${k}">${fm(sp)}</span> dari ${S.dur[j]} menit</small><div class="bar"><i style="width:${Math.min(100,sp/(S.dur[j]*.6))}%"></i></div></div><button class="btn s" data-a="run" data-k="${k}">${r?'Jeda':'Mulai'}</button></div>`};
const VW={
home(){const a=act(),n=doneN(),g=S.goal*60,ts=todayS(),dn=ACT.filter((_,j)=>S.done[a]&&S.done[a][j]).length;
return `<p class="mut">${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}</p><h1>Mari belajar hari ini</h1>
<section class="hero"><svg viewBox="0 0 100 100" width="92" height="92"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="8"/><circle cx="50" cy="50" r="42" fill="none" stroke="#6d9bff" stroke-width="8" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="${264*(1-n/30)}" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" fill="#fff" font-size="22" font-family="Georgia,serif">${n}/30</text></svg><div><p class="mut">Hari aktif</p><h2>Hari ${a+1}</h2><p>${esc(DAYS[a].t)}</p><button class="btn" data-a="open" data-i="${a}">Lanjutkan (${dn}/5)</button></div></section>
<div class="stats"><div><b>${streak()}</b><small class="mut">hari beruntun</small></div><div><b data-live="total">${hm(totalS())}</b><small class="mut">total belajar</small></div><div><b>${n}</b><small class="mut">hari selesai</small></div></div>
<div class="sec"><div class="row between"><b>Target hari ini</b><small class="mut"><span data-live="today">${hm(ts)}</span> dari ${S.goal} mnt</small></div><div class="bar"><i style="width:${Math.min(100,ts/g*100)}%"></i></div></div>
<div class="sec row between"><div><b>Absen harian</b><br><small class="mut">${S.att[tk()]?'Kamu sudah absen hari ini':'Catat bahwa kamu belajar hari ini'}</small></div><button class="btn ${S.att[tk()]?'s':''}" data-a="abs">${S.att[tk()]?'Batalkan':'Absen'}</button></div>`},
plan(){if(SEL===null)return '<h1>Kurikulum 30 hari</h1>'+PH.map((p,k)=>`<h3 class="ph">${p}<span>Hari ${k*10+1}–${k*10+10}</span></h3>`+DAYS.slice(k*10,k*10+10).map((d,x)=>{const i=k*10+x,n=ACT.filter((_,j)=>S.done[i]&&S.done[i][j]).length;return `<button class="day ${isDone(i)?'ok':''} ${i===act()?'cur':''}" data-a="open" data-i="${i}"><span class="n">${i+1}</span><span class="g">${esc(d.t)}</span><small class="mut">${isDone(i)?'Selesai':n+'/5'}</small></button>`}).join('')).join('');
const i=SEL,d=DAYS[i],ph=Math.floor(i/10);
return `<button class="lnk" data-a="back">‹ Semua hari</button><p class="mut">Hari ${i+1}, fase ${PH[ph]}</p><h1>${esc(d.t)}</h1><p class="note">Rujukan buku: ${BOOK[ph]}. Cari topik serupa di daftar isi bukumu, lalu cocokkan dengan materi di bawah.</p><h3>Materi</h3>${d.p.map(x=>`<div class="pc"><p class="en">${esc(x[0])}</p><p>${esc(x[1])}</p><small class="mut">Ucapkan: ${esc(x[2])}</small><br><button class="chip" data-a="say" data-t="${esc(x[0])}">Dengar</button></div>`).join('')}<h3>Aktivitas ${isDone(i)?'(hari ini selesai)':''}</h3>${ACT.map((_,j)=>actRow(i,j)).join('')}<div class="row between" style="margin-top:16px"><button class="btn s" data-a="open" data-i="${Math.max(0,i-1)}">‹ Sebelumnya</button><button class="btn s" data-a="open" data-i="${Math.min(29,i+1)}">Berikutnya ›</button></div>`},
prac(){return `<h1>Latihan</h1><div class="chips">${[['cards','Flashcard'],['quiz','Kuis'],['talk','Speaking']].map(([k,l])=>`<button class="chip ${PT===k?'on':''}" data-a="pt" data-t="${k}">${l}</button>`).join('')}</div>`+PV[PT]()},
notes(){const e=NE?S.notes.find(n=>n.id===NE):null;return `<h1>Catatan</h1><div class="sec"><select id="nty"><option value="grammar" ${e&&e.type==='grammar'?'selected':''}>Grammar</option><option value="vocab" ${e&&e.type==='vocab'?'selected':''}>Kosakata</option></select><input id="nti" placeholder="Judul atau kata (bahasa Inggris)" value="${esc(e?e.title:'')}"><textarea id="nbd" rows="3" placeholder="Penjelasan, arti, atau contoh">${esc(e?e.body:'')}</textarea><div class="row"><button class="btn" data-a="nsave">${e?'Simpan perubahan':'Tambah catatan'}</button>${e?'<button class="btn s" data-a="ncancel">Batal</button>':''}</div></div><input id="nq" type="search" placeholder="Cari catatan" value="${esc(NQ)}"><div class="chips">${[['all','Semua'],['grammar','Grammar'],['vocab','Kosakata']].map(([k,l])=>`<button class="chip ${NF===k?'on':''}" data-a="nf" data-f="${k}">${l}</button>`).join('')}</div><div id="nl">${nlist()}</div>`},
me(){const q=S.quiz,best=q.length?Math.max(...q.map(x=>Math.round(x.s/x.n*100))):0,n=doneN(),st=streak(),kn=Object.keys(S.known).length;
const A=[['Langkah pertama','Selesaikan 1 hari',n>=1],['Konsisten','Streak 7 hari',st>=7],['Sepuluh hari','Selesaikan 10 hari',n>=10],['Pencatat','Buat 5 catatan',S.notes.length>=5],['Penghafal','Hafal 20 kartu',kn>=20],['Kuis sempurna','Skor 100% di kuis',best===100],['Tamat','Selesaikan 30 hari',n>=30]];
const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+CM);const y=d.getFullYear(),m=d.getMonth();let c='';for(let i=0;i<d.getDay();i++)c+='<i></i>';for(let i=1;i<=new Date(y,m+1,0).getDate();i++){const k=y+'-'+p2(m+1)+'-'+p2(i);c+=`<b class="${studied(k)?'on':''} ${k===tk()?'td':''}">${i}</b>`}
return `<h1>Profil</h1><div class="stats"><div><b>${hm(totalS())}</b><small class="mut">total belajar</small></div><div><b>${Object.keys(S.att).length}</b><small class="mut">hari absen</small></div><div><b>${best}%</b><small class="mut">skor kuis terbaik</small></div></div><div class="stats"><div><b>${kn}</b><small class="mut">kartu hafal</small></div><div><b>${S.notes.length}</b><small class="mut">catatan</small></div><div><b>${q.length}</b><small class="mut">kuis selesai</small></div></div>
<h3>Kalender belajar</h3><div class="sec"><div class="row between"><button class="chip" data-a="cal" data-n="-1">‹</button><b>${d.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</b><button class="chip" data-a="cal" data-n="1">›</button></div><div class="cal">${['M','S','S','R','K','J','S'].map(x=>`<u>${x}</u>`).join('')}${c}</div><small class="mut">Hari terisi: absen atau belajar minimal 1 menit.</small></div>
<h3>Pencapaian</h3><div class="sec">${A.map(a=>`<div class="ach ${a[2]?'on':''}"><i>${a[2]?'✓':''}</i><div><b>${a[0]}</b><br><small class="mut">${a[1]}</small></div></div>`).join('')}</div>
<h3>Pengaturan</h3><div class="sec"><label>Target belajar harian (menit)</label><input type="number" min="1" max="240" data-s="goal" value="${S.goal}"><div class="g2">${ACT.map((a,j)=>`<div><label>${a} (mnt)</label><input type="number" min="1" max="240" data-s="d${j}" value="${S.dur[j]}"></div>`).join('')}</div></div>
<h3>Backup data</h3><div class="sec"><p class="mut" style="margin-bottom:12px">Data tersimpan di browser ini. Ekspor secara berkala agar aman.</p><div class="row" style="flex-wrap:wrap"><button class="btn" data-a="exp">Ekspor JSON</button><button class="btn s" data-a="imp">Impor JSON</button><button class="btn s" data-a="reset">Hapus semua</button></div></div>`}};
const nlist=()=>{const q=NQ.toLowerCase(),L=S.notes.filter(n=>(NF==='all'||n.type===NF)&&(n.title+' '+n.body).toLowerCase().includes(q)).sort((a,b)=>b.ts-a.ts);return L.length?L.map(n=>`<div class="sec nt"><span class="tag">${n.type==='vocab'?'Kosakata':'Grammar'}</span><h3 style="margin:6px 0">${esc(n.title)}</h3><p style="white-space:pre-wrap">${esc(n.body)}</p><div class="row" style="margin-top:10px"><button class="chip" data-a="nedit" data-id="${n.id}">Edit</button><button class="chip" data-a="ndel" data-id="${n.id}">Hapus</button></div></div>`).join(''):`<p class="mut">${S.notes.length?'Tidak ada catatan yang cocok.':'Belum ada catatan. Tambahkan grammar atau kosakata pertamamu di atas.'}</p>`};
const PV={cards(){const all=deck(),left=all.filter(c=>!S.known[c.en]),k=all.length-left.length;if(!left.length)return `<div class="sec card3"><h2>Semua kartu sudah hafal</h2><p class="mut">Buka hari berikutnya atau tambah kosakata di Catatan.</p><button class="btn s" data-a="kreset">Ulangi dari awal</button></div>`;const c=left[C.i%left.length];
return `<p class="mut">${k} dari ${all.length} kartu hafal</p><div class="bar" style="margin-bottom:14px"><i style="width:${k/all.length*100}%"></i></div><div class="sec card3"><p class="en" style="font-size:24px">${esc(c.en)}</p>${C.s?`<p>${esc(c.id)}</p><small class="mut">${esc(c.pr)}</small>`:'<small class="mut">Ingat artinya, lalu cek jawaban</small>'}</div>`+(C.s?`<div class="row"><button class="btn w" data-a="kyes" data-e="${esc(c.en)}">Hafal</button><button class="btn s w" data-a="kno">Ulangi nanti</button></div>`:'<button class="btn w" data-a="kshow">Tampilkan jawaban</button>')},
quiz(){if(!Q){const b=S.quiz.length?`<p class="mut" style="margin-top:12px">Kuis terakhir: ${S.quiz[S.quiz.length-1].s}/${S.quiz[S.quiz.length-1].n}</p>`:'';return `<div class="sec"><p>5 soal pilihan ganda dari materi sampai Hari ${act()+1}. Setiap soal punya pembahasan.</p>${b}<br><button class="btn w" data-a="qs">Mulai kuis</button></div>`}
if(Q.i>=Q.q.length)return `<div class="sec"><p class="mut">Skor akhir</p><h1>${Q.s} dari ${Q.q.length}</h1>${Q.q.map(x=>`<p><b>${x.ok?'✓':'✗'} ${esc(x.c[0])}</b><br>${esc(x.c[1])}</p><br>`).join('')}<button class="btn w" data-a="qs">Ulangi dengan soal baru</button></div>`;
const q=Q.q[Q.i];return `<p class="mut">Soal ${Q.i+1} dari ${Q.q.length}</p><div class="sec"><p class="en" style="font-size:22px">${esc(q.c[0])}</p><p class="mut" style="margin-bottom:12px">Apa artinya?</p>${q.o.map((o,n)=>`<button class="opt ${Q.a===null?'':o===q.c?'ok':Q.a===n?'bad':''}" data-a="qa" data-n="${n}">${esc(o[1])}</button>`).join('')}${Q.a!==null?`<p class="note">${q.ok?'Benar. ':'Kurang tepat. '}Arti: ${esc(q.c[1])} Pelafalan: ${esc(q.c[2])}</p><button class="btn w" data-a="qn">${Q.i+1<Q.q.length?'Lanjut':'Lihat hasil'}</button>`:''}</div>`},
talk(){const dl=DL[TK.d];return `<div class="chips">${DL.map((d,i)=>`<button class="chip ${TK.d===i?'on':''}" data-a="td" data-i="${i}">${d.t}</button>`).join('')}</div><div class="chips"><small class="mut" style="align-self:center">Kamu berperan sebagai</small>${['A','B'].map(r=>`<button class="chip ${TK.r===r?'on':''}" data-a="tr" data-r="${r}">${r}</button>`).join('')}</div><p class="note">Baca keras baris yang bergaris biru. Tekan Dengar untuk baris lawan bicara.</p>${dl.l.map(l=>`<div class="ln ${l[0]===TK.r?'me':''}"><small class="mut">${l[0]}${l[0]===TK.r?' (giliranmu)':''}</small><p class="en">${esc(l[1])}</p><p class="mut">${esc(l[2])}</p><button class="chip" data-a="say" data-t="${esc(l[1])}">Dengar</button></div>`).join('')}`}};
const say=t=>{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}else toast('Suara tidak didukung di browser ini')};
const H={v:d=>{V=d.v;go()},open:d=>{V='plan';SEL=+d.i;go()},back:()=>{SEL=null;go()},say:d=>say(d.t),
tgl:d=>{const i=+d.i,j=+d.j,was=isDone(i);(S.done[i]=S.done[i]||{})[j]=S.done[i][j]?0:1;save();render();if(!was&&isDone(i))toast('Hari '+(i+1)+' selesai')},
run:d=>{const same=S.run&&S.run.k===d.k;stop();if(!same){S.run={k:d.k,t0:Date.now()};save()}render()},
abs:()=>{S.att[tk()]?delete S.att[tk()]:S.att[tk()]=1;save();render()},
pt:d=>{PT=d.t;render()},kshow:()=>{C.s=1;render()},kyes:d=>{S.known[d.e]=1;C.s=0;save();render()},kno:()=>{C.i++;C.s=0;render()},kreset:()=>{S.known={};C={i:0,s:0};save();render()},
qs:()=>{const P=sh(pool()).slice(0,5);Q={i:0,s:0,a:null,q:P.map(c=>({c,ok:false,o:sh([c].concat(sh(ALLP.filter(x=>x[1]!==c[1])).slice(0,3)))}))};render()},
qa:d=>{if(Q.a!==null)return;const q=Q.q[Q.i];Q.a=+d.n;q.ok=q.o[Q.a]===q.c;if(q.ok)Q.s++;render()},
qn:()=>{Q.i++;Q.a=null;if(Q.i>=Q.q.length){S.quiz.push({d:tk(),s:Q.s,n:Q.q.length});save()}render()},
td:d=>{TK.d=+d.i;render()},tr:d=>{TK.r=d.r;render()},
nsave:()=>{const ty=$('#nty').value,ti=$('#nti').value.trim(),bd=$('#nbd').value.trim();if(!ti||!bd)return toast('Isi judul dan penjelasan dulu');if(NE){const n=S.notes.find(x=>x.id===NE);Object.assign(n,{type:ty,title:ti,body:bd})}else S.notes.push({id:'n'+Date.now(),type:ty,title:ti,body:bd,ts:Date.now()});NE=null;save();render();toast('Catatan disimpan')},
ncancel:()=>{NE=null;render()},nedit:d=>{NE=d.id;go()},ndel:d=>{if(confirm('Hapus catatan ini?')){S.notes=S.notes.filter(n=>n.id!==d.id);save();render()}},nf:d=>{NF=d.f;render()},
cal:d=>{CM+=+d.n;render()},
exp:()=>{stop();const b=new Blob([JSON.stringify({app:'english-journey-pro',v:2,exported:new Date().toISOString(),data:S},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='english-journey-pro-'+tk()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup diunduh')},
imp:()=>$('#imp').click(),
reset:()=>{if(confirm('Hapus semua progres dan catatan? Tindakan ini tidak bisa dibatalkan.')){S=def();save();Q=null;SEL=null;go()}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&H[b.dataset.a])H[b.dataset.a](b.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='nq'){NQ=e.target.value;$('#nl').innerHTML=nlist()}});
document.addEventListener('change',e=>{const s=e.target.dataset&&e.target.dataset.s;if(s){const v=Math.min(240,Math.max(1,parseInt(e.target.value)||1));e.target.value=v;s==='goal'?S.goal=v:S.dur[+s[1]]=v;save();toast('Pengaturan disimpan')}
if(e.target.id==='imp'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),d=j.data||j;if(!d||typeof d.done!=='object'||!Array.isArray(d.notes))throw 0;S=Object.assign(def(),d,{run:null});save();Q=null;SEL=null;go();toast('Data berhasil diimpor')}catch(x){toast('File backup tidak valid')}};r.readAsText(f);e.target.value=''}});
setInterval(()=>{if(!S.run)return;document.querySelectorAll('[data-tk]').forEach(el=>{const k=el.dataset.tk;el.textContent=fm((S.spent[k]||0)+(S.run&&S.run.k===k?live():0))});document.querySelectorAll('[data-live]').forEach(el=>el.textContent=hm(el.dataset.live==='today'?todayS():totalS()))},1000);
render();if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
